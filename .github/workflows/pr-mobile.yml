name: Mobile CI

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
      - test

permissions:
  contents: read

jobs:
  version-subida:
    name: Versión subida
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el commit base para leer su app.json con `git show`.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Verificar que la versión subió
        run: node scripts/verificar-version.js "${{ github.event.pull_request.base.sha }}"

  mobile-check:
    name: Expo Doctor
    # Playwright 1.56 supports Ubuntu 24.04; keep the runner compatible with the lockfile.
    runs-on: ubuntu-24.04
    # Normalmente tarda ~4 min. Con el espejo de apt lento, instalar Chromium llegó a 7 min
    # y el job se cortó a los 10 con todos los pasos en verde.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test session and offline queue
        run: npm test

      - name: Build PWA
        run: npm run build:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test PWA offline persistence
        run: npm run test:web

      - name: Build static PWA container
        run: docker build -t chaco-mobile:pwa-ci .

      - name: Check static hosting and runtime configuration
        run: node tests/docker-smoke.cjs chaco-mobile:pwa-ci

      - name: Run Expo Doctor
        run: npx expo-doctor
