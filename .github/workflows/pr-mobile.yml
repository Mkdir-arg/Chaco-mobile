name: Mobile CI

on:
  pull_request:
    branches:
      - main
      - test
  push:
    branches:
      - main
      - test

permissions:
  contents: read

jobs:
  mobile-check:
    name: Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test session and offline queue
        run: npm test

      - name: Build PWA
        run: npm run build:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test PWA offline persistence
        run: npm run test:web

      - name: Build static PWA container
        run: docker build -t chaco-mobile:pwa-ci .

      - name: Check static hosting and runtime configuration
        run: node tests/docker-smoke.cjs chaco-mobile:pwa-ci

      - name: Run Expo Doctor
        run: npx expo-doctor
