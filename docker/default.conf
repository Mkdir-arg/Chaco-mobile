# Cache policy is declared once so every location inherits the isolation headers.
map $uri $pwa_cache_control {
    default "no-cache";
    /runtime-config.js "no-store";
    ~^/_expo/static/ "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $pwa_cache_control always;

    # El bundle de Expo pesa ~2,2 MB en crudo y ~600 KB comprimido: sin esto cada
    # dispositivo que abre la app por primera vez se baja los 2,2 MB. Los .gz los
    # genera el build (gzip_static), asi que no cuesta CPU por request; `gzip on`
    # cubre lo que no quedo precomprimido. `gzip_proxied any` es obligatorio: por
    # defecto nginx no comprime respuestas a un request proxyado, y aca siempre
    # entra por detras de FortiWeb. runtime-config.js nunca se precomprime —lo
    # escribe el entrypoint en cada arranque— porque un .gz viejo serviria la URL
    # del backend equivocada sin que nada falle a la vista.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_http_version 1.0;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json
               application/wasm image/svg+xml text/css text/plain;

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    # No application backend or reverse proxy in this container.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    # A missing bundle/worker/WASM must not receive index.html with status 200.
    location ~* \.(?:js|css|wasm|json|webmanifest|png|jpe?g|webp|gif|svg|ico|ttf|woff2?)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
